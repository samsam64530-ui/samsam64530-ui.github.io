<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demande envoyée — Samuel Latapie</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f7b6c'/%3E%3Ctext x='32' y='42' font-family='monospace' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3ESL%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --text:#14171c; --muted:#5b6472;
  --border:#e2e5ea; --accent:#0f7b6c; --accent-soft:#e3f3f0; --code:#eef0f3; --on-accent:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --surface:#161b22; --text:#e6e9ee; --muted:#9aa4b2;
    --border:#262d38; --accent:#3cc4ae; --accent-soft:#12312c; --code:#1d232d; --on-accent:#0e1116;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --surface:#161b22; --text:#e6e9ee; --muted:#9aa4b2;
  --border:#262d38; --accent:#3cc4ae; --accent-soft:#12312c; --code:#1d232d; --on-accent:#0e1116;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0; background:var(--bg); color:var(--text);
  font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
a{color:var(--accent)}
.wrap{max-width:900px; margin:0 auto; padding:0 16px}
.mono{font-family:ui-monospace,"Cascadia Code",Consolas,monospace}

/* Nav */
nav{position:sticky; top:0; z-index:10; background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--border)}
nav .wrap{display:flex; align-items:center; justify-content:space-between; height:56px; gap:12px}
.logo{font-weight:700; text-decoration:none; color:var(--text)}
.logo span{color:var(--accent)}
nav ul{display:flex; gap:18px; list-style:none; margin:0; padding:0}
nav ul a{color:var(--muted); text-decoration:none; font-size:.95rem}
nav ul a:hover{color:var(--text)}
@media (max-width:560px){ nav ul{display:none} }
.theme-toggle{background:none; border:1px solid var(--border); color:var(--text); border-radius:8px;
  padding:4px 10px; cursor:pointer}

/* Hero */
.hero{padding:64px 0 40px}
.tag{display:inline-block; font-size:.85rem; background:var(--accent-soft); color:var(--accent);
  padding:4px 10px; border-radius:999px}
h1{font-size:clamp(2rem,5vw,2.8rem); line-height:1.15; margin:16px 0 12px}
.hero p{color:var(--muted); max-width:600px; font-size:1.08rem; margin:0 0 24px}
.btns{display:flex; flex-wrap:wrap; gap:12px}
.btn{display:inline-block; padding:10px 18px; border-radius:8px; text-decoration:none; font-weight:600;
  border:1px solid var(--accent)}
.btn.primary{background:var(--accent); color:var(--on-accent)}
.btn.ghost{color:var(--accent)}

/* Chiffres clés */
.env{margin-top:40px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:22px}
.env-title{display:flex; align-items:center; gap:8px; font-weight:700; font-size:1rem; margin:0 0 18px}
.env-title small{font-weight:500; color:var(--muted); font-size:.9rem}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.stat{border-radius:12px; padding:18px 14px; text-align:center; background:var(--accent-soft)}
.stat b{display:block; font-size:2.4rem; color:var(--accent); line-height:1.1; font-weight:800}
.stat .lbl{display:block; margin-top:8px; font-size:1rem; font-weight:600; color:var(--text)}
.stat .sub{display:block; margin-top:2px; font-size:.85rem; color:var(--muted)}
@media (max-width:600px){ .stats{grid-template-columns:1fr} .stat b{font-size:2rem} }

/* Sections */
section{padding:44px 0; border-top:1px solid var(--border)}
h2{font-size:1.5rem; margin:0 0 18px}
h3{margin:0 0 6px; font-size:1.05rem}
.muted{color:var(--muted)}

/* Onglets */
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px}
.tab{background:none; border:1px solid var(--border); color:var(--muted); padding:8px 16px;
  border-radius:999px; cursor:pointer; font:inherit; font-size:.95rem}
.tab[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600}
.panel[hidden]{display:none}

.grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px}
.card .ctx{font-size:.8rem; color:var(--accent); font-weight:600; margin-bottom:6px}
.card p{margin:0 0 10px; color:var(--muted); font-size:.95rem}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-size:.78rem; background:var(--code); padding:2px 8px; border-radius:6px}
.badge{font-size:.72rem; padding:1px 7px; border-radius:999px; background:var(--accent-soft); color:var(--accent); margin-left:6px; vertical-align:middle}

/* Timeline */
.cols{display:grid; gap:24px; grid-template-columns:1fr 1fr}
@media (max-width:720px){ .cols{grid-template-columns:1fr} }
.timeline{list-style:none; margin:0; padding:0; border-left:2px solid var(--border)}
.timeline li{position:relative; padding:0 0 18px 18px}
.timeline li::before{content:""; position:absolute; left:-7px; top:7px; width:12px; height:12px;
  border-radius:50%; background:var(--accent)}
.when{font-size:.8rem; color:var(--muted)}
.timeline small{display:block; color:var(--muted); font-size:.9rem}

/* Services */
.services{display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.service{display:flex; gap:12px; align-items:flex-start; background:var(--surface); border:1px solid var(--border);
  border-radius:12px; padding:14px}
.service .ico{font-size:1.4rem; line-height:1}
.service p{margin:2px 0 0; color:var(--muted); font-size:.9rem}
.note{margin-top:16px; padding:12px 16px; border-radius:10px; background:var(--accent-soft); font-size:.95rem}

.contact{display:flex; flex-wrap:wrap; gap:12px}
footer{padding:24px 0; color:var(--muted); font-size:.85rem; border-top:1px solid var(--border)}

/* Photo */
.id{display:flex; align-items:center; gap:24px}
.avatar{width:120px; height:120px; border-radius:50%; flex-shrink:0;
  box-shadow:0 0 0 4px var(--bg), 0 0 0 6px var(--accent)}
@media (max-width:560px){ .id{flex-direction:column; align-items:flex-start; gap:16px} .avatar{width:96px; height:96px} }

/* ===== Animations ===== */
.hero{position:relative; overflow:hidden}
#net{position:absolute; inset:0; width:100%; height:100%; z-index:0; pointer-events:none;
  mask-image:linear-gradient(to bottom, #000 55%, transparent);
  -webkit-mask-image:linear-gradient(to bottom, #000 55%, transparent)}
.hero .wrap{position:relative; z-index:1}

/* Dégradé animé sur le titre */
.grad{background:linear-gradient(90deg,var(--accent),#3b82f6,var(--accent));
  background-size:200% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% center}}

/* Pastille "disponible" */
.tag{display:inline-flex; align-items:center; gap:8px}
.dot{width:8px; height:8px; border-radius:50%; background:#22c55e; position:relative}
.dot::after{content:""; position:absolute; inset:0; border-radius:50%; background:#22c55e;
  animation:ping 1.8s ease-out infinite}
@keyframes ping{to{transform:scale(2.6); opacity:0}}

/* Apparition au défilement */
.reveal{opacity:0; transform:translateY(18px); transition:opacity .6s ease, transform .6s ease}
.reveal.in{opacity:1; transform:none}

/* Survol des cartes */
.card,.service,.stat{transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease}
.card:hover,.service:hover,.stat:hover{transform:translateY(-3px); border-color:var(--accent);
  box-shadow:0 8px 24px -12px color-mix(in srgb,var(--accent) 60%,transparent)}
.btn{transition:transform .15s ease, box-shadow .15s ease}
.btn:hover{transform:translateY(-2px); box-shadow:0 6px 18px -8px var(--accent)}
.tab{transition:background .2s, color .2s, border-color .2s}
.tab:hover{border-color:var(--accent); color:var(--text)}

/* Transition des onglets */
.panel:not([hidden]){animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}

/* Accessibilité : pas d'animation si l'utilisateur l'a désactivée */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important; transition:none!important}
  .reveal{opacity:1; transform:none}
}
</style><style>.legal h2{font-size:1.2rem;margin:28px 0 8px}.legal p{margin:0 0 10px}</style></head>

<nav><div class="wrap"><a class="logo mono" href="index.html">samuel<span>@</span>latapie:~$</a>
<button class="theme-toggle" id="themeBtn" aria-label="Changer de thème">◐</button></div></nav>
<main class="wrap" style="padding:72px 16px; max-width:620px; text-align:center">
  <div style="font-size:3rem">✅</div>
  <h1 style="font-size:2rem; margin:10px 0">Demande bien envoyée !</h1>
  <p class="muted" style="font-size:1.08rem">Merci, j'ai bien reçu votre demande de dépannage.<br>
  Je reviens vers vous rapidement avec un <strong>devis gratuit</strong>, en général sous 24 à 48 h.</p>
  <div class="btns" style="justify-content:center; margin-top:28px">
    <a class="btn primary" href="depannage.html">Retour à la page dépannage</a>
    <a class="btn ghost" href="index.html">Voir mon portfolio</a>
  </div>
</main>
<footer><div class="wrap">© <span id="y"></span> Samuel Latapie · <a href="mentions-legales.html">Mentions légales</a></div></footer>
<script>
document.getElementById('y').textContent=new Date().getFullYear();
const root=document.documentElement,btn=document.getElementById('themeBtn');
try{const t=localStorage.getItem('theme');if(t)root.dataset.theme=t;}catch(e){}
btn.addEventListener('click',()=>{const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;root.dataset.theme=dark?'light':'dark';try{localStorage.setItem('theme',root.dataset.theme);}catch(e){}});
</script>
</body>
</html>
